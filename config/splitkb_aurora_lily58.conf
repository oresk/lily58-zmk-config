# Uncomment these two line to add support for encoders to your firmware
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the OLED Display
# NOTE: nice-view-gem custom display removed during BT/freeze instability
# debugging. Keeping the display off removes the LVGL/draw CPU load from the
# central and gives the cleanest stability test. Re-enable a display later
# once the flapping/freeze is resolved.
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Split peripheral battery reporting
# NOTE: this polls the peripheral over BLE on the central; disabled while
# there's no display to show it and to reduce BLE traffic.
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Uncomment the following lines to enable RGB underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Power management / battery
# Deep sleep on both halves after inactivity. Biggest lever for BT runtime,
# especially on the peripheral (right) half which otherwise never sleeps.
CONFIG_ZMK_SLEEP=y
# Enter deep sleep after 5 min of inactivity (default 15 min). Lower so we
# can verify sleep behaviour during testing without waiting too long.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

#CONFIG_PM_DEVICE=n
#CONFIG_PM=n